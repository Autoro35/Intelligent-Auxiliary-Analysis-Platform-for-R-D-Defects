# ============================================================
# 轻量化研发缺陷全生命周期管理平台 - 主配置
# 所有可配置项均通过环境变量覆盖，禁止硬编码
# ============================================================
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: defect-platform

  # 数据源（MySQL 8.0）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:defect_platform}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3000ms

  # RabbitMQ
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}
    virtual-host: ${RABBIT_VHOST:/}

  # 文件上传
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # Jackson 全局时间格式（LocalDateTime 由 JacksonConfig 进一步处理）
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.defect.platform.entity
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，生产可改为 NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 全局逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  # HS256 密钥需 >= 32 字节，生产环境务必通过环境变量覆盖
  secret: ${JWT_SECRET:defect-platform-jwt-secret-key-please-change-in-prod-0123456789}
  # token 有效期（秒），默认 24 小时
  expiration: ${JWT_EXPIRATION:86400}
  header: Authorization
  prefix: "Bearer "

# 初始化管理员账号（首次启动自动创建，密码生产环境务必覆盖）
init:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
    nickname: ${ADMIN_NICKNAME:系统管理员}

# 文件上传配置
file:
  # 本地存储根目录
  upload-dir: ${UPLOAD_DIR:./uploads}
  # 单文件大小上限（字节）
  max-size: 10485760

# AI 能力配置（DeepSeek，OpenAI 兼容协议）
# 未配置 api-key 时 AI 接口自动降级为本地规则引擎，功能仍可用（响应中 source=RULE）
ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    # 连接/读取超时（毫秒）
    timeout: ${DEEPSEEK_TIMEOUT:30000}
    # 采样温度，缺陷判定类任务宜低以保证结果稳定
    temperature: ${DEEPSEEK_TEMPERATURE:0.3}
    # 单次回复最大 token 数
    max-tokens: ${DEEPSEEK_MAX_TOKENS:1024}

# Chroma 向量库配置
# 不可达时 RAG 检索自动降级为 t_knowledge 的 ngram 全文索引（响应中 retrievalMode=FULLTEXT）
chroma:
  host: ${CHROMA_HOST:localhost}
  port: ${CHROMA_PORT:8000}
  # Chroma 0.5+/1.x 使用 /api/v2，0.4.x 使用 /api/v1
  api-path: ${CHROMA_API_PATH:/api/v2}
  tenant: ${CHROMA_TENANT:default_tenant}
  database: ${CHROMA_DATABASE:default_database}
  collection: ${CHROMA_COLLECTION:defect_knowledge}
  timeout: ${CHROMA_TIMEOUT:5000}

logging:
  level:
    com.defect.platform: info
